name: OSWatchCompanion
options:
  bundleIdPrefix: com.oswatch.companion
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
targets:
  OSWatchCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: "OSWatchCompanion Watch App"
        excludes:
          - "Info.plist"
    info:
      path: "OSWatchCompanion iOS/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oswatch.companion.ios
        PRODUCT_NAME: OSWatchCompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "OSWatchCompanion iOS/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: 5.0
    scheme:
      testTargets: []

  OSWatchCompanion Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: "OSWatchCompanion Watch App"
        excludes:
          - "Info.plist"
    info:
      path: "OSWatchCompanion Watch App/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oswatch.companion.watchkitapp
        PRODUCT_NAME: "OSWatchCompanion Watch App"
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "OSWatchCompanion Watch App/Info.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: 5.0
    scheme:
      testTargets: []
