name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unsigned iOS App
        run: |
          xcodebuild -project OSWatchCompanion.xcodeproj \
            -scheme OSWatchCompanion \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT=$(pwd)/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/OSWatchCompanion.app Payload/
          zip -r OSWatchCompanion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSWatchCompanion-IPA
          path: OSWatchCompanion.ipa
