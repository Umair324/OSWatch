name: Build Unsigned iOS IPA (Sideloadly)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build OSWatchCompanion.ipa
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Unsigned iOS App (Release)
        run: |
          xcodebuild build \
            -project "OSWatchCompanion.xcodeproj" \
            -scheme "OSWatchCompanion" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into OSWatchCompanion.ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OSWatchCompanion.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Built .app not found at $APP_PATH"
            exit 1
          fi

          rm -rf Payload OSWatchCompanion.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r9 OSWatchCompanion.ipa Payload
          ls -lh OSWatchCompanion.ipa

      - name: Upload OSWatchCompanion.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSWatchCompanion-IPA
          path: OSWatchCompanion.ipa
          if-no-files-found: error
          retention-days: 30
