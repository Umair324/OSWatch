name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Project if project.yml exists
        run: |
          if [ -f "project.yml" ]; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build Unsigned iOS App
        run: |
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Available targets & schemes:"
          xcodebuild -list -project "$PROJECT_FILE"
          
          TARGET=$(xcodebuild -list -project "$PROJECT_FILE" | awk '/Targets:/,/^$/' | sed '1d' | grep -vi "Watch" | grep -vi "Tests" | head -n 1 | xargs)
          echo "Building Project: $PROJECT_FILE | Target: $TARGET"
          
          xcodebuild -project "$PROJECT_FILE" \
            -target "$TARGET" \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT=$(pwd)/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" | grep -i "Release-iphoneos" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r OSWatchCompanion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSWatchCompanion-IPA
          path: OSWatchCompanion.ipa
